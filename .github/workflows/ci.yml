name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crossexam
          POSTGRES_PASSWORD: crossexam
          POSTGRES_DB: crossexam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crossexam" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and end-to-end tests (scripted model - no API key, no cost)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://crossexam:crossexam@localhost:5432/crossexam_test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build the web screen
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crossexam:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the Kubernetes manifests
        run: |
          for overlay in app migrate public; do
            kubectl kustomize "infra/k8s/$overlay" > /dev/null
          done
