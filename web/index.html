<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CrossExam: every paper is a witness. The agents cross-examine them." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CrossExam</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem("crossexam.theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
