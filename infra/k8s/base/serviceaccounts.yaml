# Pods that touch Google Cloud run as one of these. Terraform grants roles to these exact
# names through Workload Identity Federation (infra/terraform/iam.tf); the web screen and
# Flower need no Google Cloud access and run as the namespace's default account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossexam-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossexam-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossexam-agent
