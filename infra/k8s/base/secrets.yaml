# Secret Manager secrets mounted as files by the GKE Secret Manager add-on, at
# /var/run/secrets/crossexam. Each file is named after the environment variable it fills;
# the container entrypoint exports them before the component starts.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: crossexam-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${PROJECT_ID}/secrets/crossexam-db-password/versions/latest"
        path: "DB_PASSWORD"
      - resourceName: "projects/${PROJECT_ID}/secrets/crossexam-gemini-api-key/versions/latest"
        path: "GOOGLE_API_KEY"
      - resourceName: "projects/${PROJECT_ID}/secrets/crossexam-langsmith-api-key/versions/latest"
        path: "LANGSMITH_API_KEY"
