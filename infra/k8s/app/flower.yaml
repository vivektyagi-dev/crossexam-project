# Flower (worker and queue dashboard): internal only.
#   kubectl -n crossexam port-forward svc/crossexam-flower 5555
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossexam-flower
  labels: { app: crossexam-flower }
spec:
  replicas: 1
  selector:
    matchLabels: { app: crossexam-flower }
  template:
    metadata:
      labels: { app: crossexam-flower }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: flower
          image: ${IMAGE}
          args: ["flower"]
          env:
            - { name: PORT, value: "5555" }
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef: { name: crossexam-config, key: REDIS_URL }
          ports:
            - containerPort: 5555
          resources:
            requests: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 5555 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crossexam-flower
spec:
  selector: { app: crossexam-flower }
  ports:
    - port: 5555
      targetPort: 5555
